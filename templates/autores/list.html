{% extends "base.html" %}
{% block title %}Autores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Autores</h1>
  <a href="{{ url_for('autores.crear') }}" class="btn btn-primary">+ Nuevo autor</a>
</div>

<table class="table table-striped table-hover bg-white">
  <thead class="table-dark">
    <tr><th>ID</th><th>Nombre</th><th>Nacionalidad</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for a in autores %}
    <tr>
      <td>{{ a.id_autor }}</td>
      <td>{{ a.nombre }}</td>
      <td>{{ a.nacionalidad }}</td>
      <td>
        <a href="{{ url_for('autores.editar', id=a.id_autor) }}" class="btn btn-sm btn-warning">Editar</a>
        <form method="post" action="{{ url_for('autores.eliminar', id=a.id_autor) }}" class="d-inline"
              onsubmit="return confirm('¿Seguro que deseas eliminar este autor?');">
          <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center">No hay registros.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
