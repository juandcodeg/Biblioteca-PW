{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Categorías</h1>
  <a href="{{ url_for('categorias.crear') }}" class="btn btn-primary">+ Nueva categoría</a>
</div>

<table class="table table-striped table-hover bg-white">
  <thead class="table-dark">
    <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for c in categorias %}
    <tr>
      <td>{{ c.id_categoria }}</td>
      <td>{{ c.nombre }}</td>
      <td>{{ c.descripcion or '' }}</td>
      <td>
        <a href="{{ url_for('categorias.editar', id=c.id_categoria) }}" class="btn btn-sm btn-warning">Editar</a>
        <form method="post" action="{{ url_for('categorias.eliminar', id=c.id_categoria) }}" class="d-inline"
              onsubmit="return confirm('¿Seguro que deseas eliminar esta categoría?');">
          <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center">No hay registros.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
