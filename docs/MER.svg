<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" font-family="Arial, sans-serif" font-size="13">
  <rect width="1180" height="440" fill="#ffffff"/>
  <text x="590" y="24" text-anchor="middle" font-size="18" font-weight="bold">MER · biblioteca_db</text>

  <!-- Relaciones -->
  <g stroke="#333" stroke-width="2" fill="none">
    <polyline points="240,105 280,105 280,170 320,170"/>
    <polyline points="240,345 280,345 280,260 320,260"/>
    <line x1="540" y1="200" x2="620" y2="200"/>
    <line x1="940" y1="200" x2="840" y2="200"/>
  </g>
  <g font-weight="bold" fill="#c0392b">
    <text x="246" y="99">1</text><text x="306" y="164">N</text>
    <text x="246" y="339">1</text><text x="306" y="254">N</text>
    <text x="548" y="194">1</text><text x="604" y="194">N</text>
    <text x="926" y="194">1</text><text x="846" y="194">N</text>
  </g>
  <g font-size="11" fill="#555" font-style="italic">
    <text x="252" y="135">escribe</text>
    <text x="252" y="305">clasifica</text>
    <text x="555" y="218">se presta en</text>
    <text x="858" y="218">solicita</text>
  </g>

  <!-- autores -->
  <rect x="20" y="60" width="220" height="106" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2"/>
  <rect x="20" y="60" width="220" height="30" fill="#2c6fb7"/>
  <text x="130" y="80" text-anchor="middle" fill="#fff" font-weight="bold">autores</text>
  <text x="30" y="110">PK  id_autor  SERIAL</text>
  <text x="30" y="132">nombre  VARCHAR(100)</text>
  <text x="30" y="154">nacionalidad  VARCHAR(50)</text>

  <!-- categorias -->
  <rect x="20" y="300" width="220" height="106" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2"/>
  <rect x="20" y="300" width="220" height="30" fill="#2c6fb7"/>
  <text x="130" y="320" text-anchor="middle" fill="#fff" font-weight="bold">categorias</text>
  <text x="30" y="350">PK  id_categoria  SERIAL</text>
  <text x="30" y="372">nombre  VARCHAR(50) UQ</text>
  <text x="30" y="394">descripcion  VARCHAR(200)</text>

  <!-- libros -->
  <rect x="320" y="110" width="220" height="194" fill="#eafaf0" stroke="#1e8449" stroke-width="2"/>
  <rect x="320" y="110" width="220" height="30" fill="#1e8449"/>
  <text x="430" y="130" text-anchor="middle" fill="#fff" font-weight="bold">libros</text>
  <text x="330" y="160">PK  id_libro  SERIAL</text>
  <text x="330" y="182">titulo  VARCHAR(150)</text>
  <text x="330" y="204">isbn  VARCHAR(20) UQ</text>
  <text x="330" y="226">anio  INTEGER</text>
  <text x="330" y="248">ejemplares  INTEGER</text>
  <text x="330" y="270">FK  id_autor  INTEGER</text>
  <text x="330" y="292">FK  id_categoria  INTEGER</text>

  <!-- prestamos -->
  <rect x="620" y="110" width="220" height="172" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2"/>
  <rect x="620" y="110" width="220" height="30" fill="#ca6f1e"/>
  <text x="730" y="130" text-anchor="middle" fill="#fff" font-weight="bold">prestamos</text>
  <text x="630" y="160">PK  id_prestamo  SERIAL</text>
  <text x="630" y="182">FK  id_libro  INTEGER</text>
  <text x="630" y="204">FK  id_socio  INTEGER</text>
  <text x="630" y="226">fecha_prestamo  DATE</text>
  <text x="630" y="248">fecha_devolucion  DATE</text>
  <text x="630" y="270">estado  VARCHAR(20)</text>

  <!-- socios -->
  <rect x="940" y="110" width="220" height="150" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2"/>
  <rect x="940" y="110" width="220" height="30" fill="#2c6fb7"/>
  <text x="1050" y="130" text-anchor="middle" fill="#fff" font-weight="bold">socios</text>
  <text x="950" y="160">PK  id_socio  SERIAL</text>
  <text x="950" y="182">nombre  VARCHAR(100)</text>
  <text x="950" y="204">documento  VARCHAR(20) UQ</text>
  <text x="950" y="226">correo  VARCHAR(100) UQ</text>
  <text x="950" y="248">telefono  VARCHAR(20)</text>
</svg>
